[project]
name = "amh-os-desktop"
version = "10.1.0"
description = "AMH-OS Windows desktop shell prototype"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
  "psutil>=5.9,<8",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
